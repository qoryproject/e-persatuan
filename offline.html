<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luar Talian — e-Persatuan</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/base.css">
  <style>
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(600px 400px at 70% 15%, rgba(233, 180, 76, .14), transparent 65%),
        linear-gradient(150deg, #0C1A5C, #24358C);
      color: #fff;
      padding: 1.5rem;
    }
    .offline {
      max-width: 440px;
      text-align: center;
      display: grid;
      justify-items: center;
      gap: .9rem;
    }
    .offline .mark {
      width: 64px; height: 64px; border-radius: 18px;
      display: grid; place-items: center;
      background: rgba(255, 255, 255, .1);
      border: 1px solid rgba(255, 255, 255, .18);
    }
    .offline .mark svg { width: 34px; height: 34px; }
    .offline h1 { color: #fff; margin: 0; font-size: 1.5rem; }
    .offline p { color: #C3CDF0; margin: 0; font-size: .9rem; }
    .offline .btn { margin-top: .5rem; }
  </style>
</head>
<body>
  <main class="offline">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M12 2.6 4.7 5.5v5.9c0 4.4 3.1 8.1 7.3 9.4 4.2-1.3 7.3-5 7.3-9.4V5.5L12 2.6Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        <path d="m8.4 11.9 2.5 2.5 4.8-4.9" stroke="#E9B44C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>Anda sedang luar talian</h1>
    <p>Halaman ini belum tersimpan dalam cache. Sambung semula internet dan cuba lagi.</p>
    <a class="btn btn-gold" href="app.html">Cuba Semula</a>
  </main>
</body>
</html>
